    <div class="container d-flex flex-column mb-3 mt-5 border border-2 rounded-4 p-3" style="width: 40em">
      <form>
        <div class="row mb-3">
          <label
            for="colFormLabelSm"
            class="col-sm-2 col-form-label col-form-label-sm"
            >Valor da Transação R$:
          </label>
          <div class="col-sm-10">
            <input
              type="text"
              class="form-control form-control-sm"
              id="colFormLabelSm"
              placeholder="R$ 0,00"
            />
          </div>
        </div>

           <div class="row mb-3">
             <label
            for="colFormLabelSm"
            class="col-sm-2 col-form-label col-form-label-sm"
            >Método de Pagamento:
          </label>
          <div class="col-sm-10">
            <select class="form-select" id="autoSizingSelect">
              <option selected>Selecione</option>
              <option value="1">Cartão de Crédito</option>
              <option value="2">Pix</option>
              <option value="3">Boleto</option>
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <label
            for="colFormLabelSm"
            class="col-sm-2 col-form-label col-form-label-sm"
            >Valor para o Restaurante R$:
          </label>
          <div class="col-sm-10">
            <input
              type="text"
              class="form-control form-control-sm"
              id="colFormLabelSm"
              placeholder="R$ 0,00"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label
            for="colFormLabelSm"
            class="col-sm-2 col-form-label col-form-label-sm"
            >Comissão do iFood %:
          </label>
          <div class="col-sm-10">
            <input
              type="text"
              class="form-control form-control-sm"
              id="colFormLabelSm"
            />
          </div>
        </div>
      </form>

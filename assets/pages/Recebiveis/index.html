<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciamento de Pagamento</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <header>
    <nav class="navbar">
      <div class="container-fluid d-flex justify-content-between">
        <img src="../../images/LogoIfood.png" />
        <form role="search">
          <button id="btnSair" class="btn btn-danger px-4" type="button">
            Sair
          </button>
        </form>
      </div>
    </nav>

    <nav>
      <div
        class="nav nav-tabs d-flex justify-content-evenly m-2"
        id="nav-tab"
        role="tablist"
      >
        <button
          class="nav-link px-5"
          id="nav-home-tab"
          data-bs-toggle="tab"
          data-bs-target="#nav-home"
          type="button"
          role="tab"
          aria-controls="nav-home"
          aria-selected="false"
        >
          Home
        </button>
        <button
          class="nav-link px-5"
          id="nav-profile-tab"
          data-bs-toggle="tab"
          data-bs-target="#nav-profile"
          type="button"
          role="tab"
          aria-controls="nav-profile"
          aria-selected="false"
        >
          Pagamentos
        </button>
        <button
          class="nav-link active px-5 link-danger link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
          id="nav-contact-tab"
          data-bs-toggle="tab"
          data-bs-target="#nav-contact"
          type="button"
          role="tab"
          aria-controls="nav-contact"
          aria-selected="true"
        >
          Recebíveis
        </button>
        <button
          class="nav-link px-5"
          id="nav-disabled-tab"
          data-bs-toggle="tab"
          data-bs-target="#nav-disabled"
          type="button"
          role="tab"
          aria-controls="nav-disabled"
          aria-selected="false"
        >
          Saldo e Extrato
        </button>
      </div>
    </nav>
  </header>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-sm-12 col-md-6 col-lg-6 my-4">
          <div class="tile">
            <h3 class="tile-title">
              Dias da Semana com pedidos com maior valor
            </h3>
            <div class="ratio ratio-16x9">
              <div id="salesChart"></div>
            </div>
          </div>
        </div>
        <div class="col-sm-12 col-md-6 col-lg-6 my-4">
          <div class="tile">
            <h3 class="tile-title">Pratos mais pedidos</h3>
            <div class="ratio ratio-16x9">
              <div id="supportRequestChart"></div>
            </div>
          </div>
        </div>
      </div>
      <script
        type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"
      ></script>

      <script type="text/javascript">
        const salesData = {
          xAxis: {
            type: 'category',
            data: [
              'Segunda',
              'Terça',
              'Quarta',
              'Quinta',
              'Sexta',
              'Sábado',
              'Domingo',
            ],
          },
          yAxis: {
            type: 'value',
            axisLabel: {
              formatter: '${value}',
            },
          },
          series: [
            {
              data: [150, 230, 224, 218, 135, 147, 260],
              type: 'line',
              smooth: true,
            },
          ],
          tooltip: {
            trigger: 'axis',
            formatter: '<b>{b0}:</b> ${c0}',
          },
        }

        const supportRequests = {
          tooltip: {
            trigger: 'item',
          },
          legend: {
            orient: 'vertical',
            left: 'left',
          },
          series: [
            {
              name: 'Pratos',
              type: 'pie',
              radius: '50%',
              data: [
                { value: 300, name: 'Combo Energy: Vitamina + pão de batata' },
                {
                  value: 50,
                  name: 'Combo Coffee: Café expresso + Bolo de chocolate',
                },
                { value: 100, name: 'Cookie de Nutela' },
              ],
              emphasis: {
                itemStyle: {
                  shadowBlur: 10,
                  shadowOffsetX: 0,
                  shadowColor: 'rgba(0, 0, 0, 0.5)',
                },
              },
            },
          ],
        }

        const salesChartElement = document.getElementById('salesChart')
        const salesChart = echarts.init(salesChartElement, null, {
          renderer: 'svg',
        })
        salesChart.setOption(salesData)
        new ResizeObserver(() => salesChart.resize()).observe(salesChartElement)

        const supportChartElement = document.getElementById(
          'supportRequestChart'
        )
        const supportChart = echarts.init(supportChartElement, null, {
          renderer: 'svg',
        })
        supportChart.setOption(supportRequests)
        new ResizeObserver(() => supportChart.resize()).observe(
          supportChartElement
        )
      </script>
    </div>
    <script src="./recebiveis.js" type="module" defer></script>
  </body>

  <footer>
    <div>
      <nav class="navbar fixed-bottom bg-transparent p-3 border border-danger">
        <div class="container-fluid d-flex justify-content-center">
          <a
            class="icons fa-brands fa-instagram navbar-brand px-4"
            target="_blank"
            href="https://www.instagram.com/ifoodbrasil/"
          ></a>
          <a
            class="icons fa-brands fa-facebook navbar-brand px-4"
            target="_blank"
            href="https://www.facebook.com/iFood/events/?locale=pt_BR&_rdr"
          ></a>
          <a
            class="icons fa-brands fa-linkedin-in navbar-brand px-4"
            target="_blank"
            href="https://www.linkedin.com/company/ifood-/posts/?feedView=all"
          ></a>
        </div>
      </nav>
    </div>
  </footer>
</html>
